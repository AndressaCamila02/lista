<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2ECC71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Lista 2026 3° SIS • Login</title>
    
    <link rel="shortcut icon" href="src/css/img/Black White Rainbow Minimalist Simple Cute Childrenswear Logo (2).ico">
    <link rel="manifest" href="manifest.json">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="src/css/login.css">
</head>
<body>
    <div class="login-container">
        <!-- Card Principal -->
        <div class="login-card">
            
            <!-- Header com Logo -->
            <div class="login-header">
                <div class="logo-wrapper">
                    <img src="src/css/icons/icon-512x512.png" alt="Lista 2026 3° SIS" class="logo-img">
                </div>
                <div class="app-brand">
                    <h1 class="app-name">Lista 2026</h1>
                    <span class="app-badge">3° SIS</span>
                </div>
                <h2 class="welcome-title">
                    Bem-vindo de volta!
                    <span class="wave-emoji">🛒</span>
                </h2>
                <p class="welcome-subtitle">Faça login para acessar suas listas compartilhadas</p>
            </div>

            <!-- Formulário -->
            <form class="login-form" onsubmit="event.preventDefault(); LOGIN();">
                
                <!-- Campo Email -->
                <div class="input-group">
                    <label for="email" class="input-label">E-mail institucional</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input type="email" id="email" class="input-field" placeholder="nome@escola.edu" required autocomplete="email">
                    </div>
                </div>

                <!-- Campo Senha -->
                <div class="input-group">
                    <label for="senha" class="input-label">Senha</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="senha" class="input-field" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Mostrar senha">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Opções Adicionais -->
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        <span class="checkbox-label">Lembrar-me neste dispositivo</span>
                    </label>
                    <a href="#" class="forgot-link">Esqueceu a senha?</a>
                </div>

                <!-- Botão Principal -->
                <button type="submit" class="btn-primary">
                    <span>Entrar na lista</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>

                <!-- Separador -->
                <div class="divider">
                    <span>Primeiro acesso?</span>
                </div>

                <!-- Botão Secundário -->
                <button type="button" class="btn-secondary" onclick="cadastro()">
                    Criar conta da turma
                </button>
            </form>

            <!-- Footer -->
            <p class="login-footer">
                Ao entrar, você concorda em compartilhar sua lista com a turma
            </p>
        </div>
        
        <!-- Background Decorativo -->
        <div class="background-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    
    <script>
        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('senha');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        }

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('✅ SW registrado:', reg.scope))
                    .catch(err => console.log('❌ SW falhou:', err));
            });
        }

        // Adicionar classe quando input tem valor
        document.querySelectorAll('.input-field').forEach(input => {
            input.addEventListener('input', function() {
                if (this.value) {
                    this.classList.add('has-value');
                } else {
                    this.classList.remove('has-value');
                }
            });
        });
    </script>
</body>
</html>
